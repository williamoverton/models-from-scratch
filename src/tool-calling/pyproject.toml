[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-calling"
version = "0.1.0"
description = "A small language model trained on synthetic tool calls"
requires-python = ">=3.12"
dependencies = ["torch", "model-training", "model-tokenizer", "pyarrow", "numpy"]

[project.scripts]
tool-calling = "tool_calling.__main__:main"

[tool.uv.sources]
model-training = { workspace = true }
model-tokenizer = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tool_calling"]
