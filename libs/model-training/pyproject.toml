[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-training"
version = "0.1.0"
description = "Shared training dashboard and progress contract for toy models"
requires-python = ">=3.12"
dependencies = ["textual", "textual-image>=0.14.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_training"]
