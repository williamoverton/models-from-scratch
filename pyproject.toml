[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Learning neural networks from scratch with PyTorch"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "textual",
    "textual-image>=0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_from_scratch"]
